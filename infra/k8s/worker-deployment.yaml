apiVersion: apps/v1
kind: Deployment
metadata: {name: amrutam-worker}
spec:
  replicas: 2
  selector: {matchLabels: {app: amrutam-worker}}
  template:
    metadata: {labels: {app: amrutam-worker}}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: registry.example.com/amrutam-api:1.0.0 # replace with immutable image digest
          command: ["python", "-m", "app.worker"]
          env:
            - {name: APP_ENV, value: production}
            - {name: RATE_LIMIT_BACKEND, value: redis}
            - {name: PAYMENTS_MODE, value: disabled}
          envFrom: [{secretRef: {name: amrutam-secrets}}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
