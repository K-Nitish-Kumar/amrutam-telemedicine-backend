global:
  scrape_interval: 15s
scrape_configs:
  - job_name: amrutam-api
    metrics_path: /metrics
    scrape_interval: 15s
    static_configs:
      - targets: ["api:8000"]
    # Set the same token as METRICS_TOKEN if using the monitoring profile.
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
