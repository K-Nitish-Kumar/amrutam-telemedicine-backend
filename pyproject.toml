[project]
name = "amrutam-telemedicine"
version = "1.0.0"
description = "Secure PostgreSQL-first telemedicine backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "SQLAlchemy>=2.0.36,<3",
  "alembic>=1.13,<2", "psycopg[binary]>=3.2,<4", "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3", "PyJWT>=2.9,<3", "argon2-cffi>=23.1,<26",
  "cryptography>=50.0.2,<51", "redis>=5,<7", "prometheus-client>=0.20,<1",
  "opentelemetry-api>=1.28,<2", "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-instrumentation-fastapi>=0.49b0,<1",
  "opentelemetry-exporter-otlp-proto-http>=1.28,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1", "pip-audit>=2.7,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
